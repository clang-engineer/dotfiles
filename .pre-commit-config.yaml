repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        language: system
        entry: shellcheck -x
        types: [shell]

      - id: shfmt
        name: shfmt
        language: system
        entry: shfmt -d -i 2 -ci
        types: [shell]

      - id: typos
        name: typos
        language: system
        entry: typos
        types: [text]
