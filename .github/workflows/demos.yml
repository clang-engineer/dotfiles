name: Record terminal demos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/demos.yml'
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install demo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fish jq fzf ripgrep fd-find bat ffmpeg ttyd
          go install github.com/charmbracelet/vhs@latest
          # The repository search script uses modern fzf actions.
          go install github.com/junegunn/fzf@latest
      - name: Prepare navigation demo
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.config/fish"
          ln -s "$(command -v fdfind)" "$HOME/.local/bin/fd"
          ln -s "$(command -v batcat)" "$HOME/.local/bin/bat"
          cp chezmoi/dot_local/bin/executable_rg.fzf "$HOME/.local/bin/rg.fzf"
          chmod +x "$HOME/.local/bin/rg.fzf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Record navigation
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          vhs docs/demos/navigation.tape
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-demos
          path: docs/demos/*.gif
          if-no-files-found: error
