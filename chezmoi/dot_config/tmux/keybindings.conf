# Native copy-mode text objects; loaded by ~/.tmux.conf.local.
# Start selection with v (OMT) or Space, then i/a and an object key.
# Delimiters use same-line jumps, not a parser: use non-empty, unnested
# pairs with the cursor inside, not on a delimiter. No escape handling.
# Word/WORD/paragraph boundaries follow tmux, not Vim iskeyword rules.
# Inspired by https://github.com/chathurb/tmux-vilto

bind-key -T copy-mode-vi i switch-client -T text-object-inner
bind-key -T copy-mode-vi a switch-client -T text-object-around

# Native word, whitespace-delimited WORD, and paragraph selection.
bind-key -T text-object-inner w send-keys -X select-word
bind-key -T text-object-inner W {
  send-keys -X clear-selection
  send-keys -X cursor-right
  send-keys -X previous-space
  send-keys -X begin-selection
  send-keys -X next-space-end
}
bind-key -T text-object-inner p {
  send-keys -X clear-selection
  send-keys -X previous-paragraph
  send-keys -X begin-selection
  send-keys -X next-paragraph
}

# Inside quotes/brackets; b/B are ()/{} aliases.
bind-key -T text-object-inner "\"" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "\""
  send-keys -X begin-selection
  send-keys -X jump-to-forward "\""
}
bind-key -T text-object-inner "'" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "'"
  send-keys -X begin-selection
  send-keys -X jump-to-forward "'"
}
bind-key -T text-object-inner "(" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "("
  send-keys -X begin-selection
  send-keys -X jump-to-forward ")"
}
bind-key -T text-object-inner ")" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "("
  send-keys -X begin-selection
  send-keys -X jump-to-forward ")"
}
bind-key -T text-object-inner "b" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "("
  send-keys -X begin-selection
  send-keys -X jump-to-forward ")"
}
bind-key -T text-object-inner "{" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "{"
  send-keys -X begin-selection
  send-keys -X jump-to-forward "}"
}
bind-key -T text-object-inner "}" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "{"
  send-keys -X begin-selection
  send-keys -X jump-to-forward "}"
}
bind-key -T text-object-inner "B" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "{"
  send-keys -X begin-selection
  send-keys -X jump-to-forward "}"
}
bind-key -T text-object-inner "[" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "["
  send-keys -X begin-selection
  send-keys -X jump-to-forward "]"
}
bind-key -T text-object-inner "]" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "["
  send-keys -X begin-selection
  send-keys -X jump-to-forward "]"
}
bind-key -T text-object-inner "<" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "<"
  send-keys -X begin-selection
  send-keys -X jump-to-forward ">"
}
bind-key -T text-object-inner ">" {
  send-keys -X clear-selection
  send-keys -X jump-to-backward "<"
  send-keys -X begin-selection
  send-keys -X jump-to-forward ">"
}

# Cancel only the pending object key; stay in copy mode.
bind-key -T text-object-inner Escape switch-client -T root
bind-key -T text-object-inner C-c switch-client -T root
bind-key -T text-object-inner q switch-client -T root
bind-key -T text-object-inner Any switch-client -T root

# Around quotes/brackets; b/B are ()/{} aliases.
bind-key -T text-object-around "\"" {
  send-keys -X clear-selection
  send-keys -X jump-backward "\""
  send-keys -X begin-selection
  send-keys -X jump-forward "\""
}
bind-key -T text-object-around "'" {
  send-keys -X clear-selection
