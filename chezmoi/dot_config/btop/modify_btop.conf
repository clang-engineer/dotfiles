{{/* chezmoi:modify-template */}}
{{- $p := includeTemplate "theme-palette" (dict "root" . "tool" "btop") | fromJson -}}
{{- $name := "Default" -}}
{{- if $p -}}{{- $name = "dotfiles" -}}{{- end -}}
{{- $setting := printf "color_theme = %q" $name -}}
{{- $pattern := "(?m)^[\\t ]*color_theme[\\t ]*=.*$" -}}
{{- if regexMatch $pattern .chezmoi.stdin -}}
{{ regexReplaceAll $pattern .chezmoi.stdin $setting -}}
{{- else -}}
{{ .chezmoi.stdin }}
{{ $setting }}
{{ end -}}
