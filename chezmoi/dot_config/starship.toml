"$schema" = 'https://starship.rs/config-schema.json'

# Cyberdream colors, with a compact left-aligned prompt.
palette = 'cyberdream'
add_newline = false
format = '$directory$git_branch$git_status$java$nodejs$character'

[palettes.cyberdream]
cyan = '#5ef1ff'
blue = '#5ea1ff'
purple = '#bd5eff'
yellow = '#f1ff5e'
green = '#5eff6c'
red = '#ff6e5e'

[directory]
style = 'bold cyan'
format = '[$path]($style) '

[git_branch]
style = 'bold purple'
format = '[ $branch]($style) '

[git_status]
style = 'yellow'
format = '([\[$all_status$ahead_behind\]]($style) )'

[java]
style = 'green'
format = '[$symbol$version]($style) '

[nodejs]
style = 'blue'
format = '[$symbol$version]($style) '

[character]
success_symbol = '[❯](bold cyan)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold purple)'
