"$schema" = 'https://starship.rs/config-schema.json'

# Switch to 'cyberdream' when using Ghostty's saved cyberdream theme.
palette = 'rose-pine-moon'
add_newline = false
format = '$directory$git_branch$git_status$java$nodejs$character'

[palettes.rose-pine-moon]
cyan = '#9ccfd8'
blue = '#3e8fb0'
purple = '#c4a7e7'
yellow = '#f6c177'
green = '#95b1ac'
red = '#eb6f92'

[palettes.cyberdream]
cyan = '#5ef1ff'
blue = '#5ea1ff'
purple = '#bd5eff'
yellow = '#f1ff5e'
green = '#5eff6c'
red = '#ff6e5e'

[directory]
style = 'bold cyan'
format = '[$path]($style) '

[git_branch]
style = 'bold purple'
format = '[ $branch]($style) '

[git_status]
style = 'yellow'
format = '([\[$all_status$ahead_behind\]]($style) )'

[java]
style = 'green'
format = '[$symbol$version]($style) '

[nodejs]
style = 'blue'
format = '[$symbol$version]($style) '

[character]
success_symbol = '[❯](bold cyan)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold purple)'
