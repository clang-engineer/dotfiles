# Oh my tmux! — the engine lives upstream in ~/.tmux/.tmux.conf.
# The managed ~/.tmux.conf wrapper loads it; the Tinty reload lives in ~/.tmux.conf.local.
# Customizations live in ~/.tmux.conf.local; tpm installs plugins into
# ~/.tmux/plugins on first launch.
[".tmux"]
    type = "git-repo"
    url = "https://github.com/gpakosz/.tmux.git"
    refreshPeriod = "168h"

# Native theme repositories are defined in the Tinty hook registry.
{{ range ((include "dot_config/tinted-theming/tinty/hooks/tmux/native-themes.json" | fromJson).repositories) }}
[".config/tmux/plugins/{{ .path }}"]
    type = "git-repo"
    url = {{ .url | quote }}
{{ if hasKey . "revision" }}
    clone.args = ["--branch", {{ .revision | quote }}]
{{ end }}
{{ end }}
