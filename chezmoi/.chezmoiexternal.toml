# Oh my tmux! — the engine lives upstream in ~/.tmux/.tmux.conf.
# The managed ~/.tmux.conf wrapper loads it; the Tinty reload lives in ~/.tmux.conf.local.
# Customizations live in ~/.tmux.conf.local; tpm installs plugins into
# ~/.tmux/plugins on first launch.
[".tmux"]
    type = "git-repo"
    url = "https://github.com/gpakosz/.tmux.git"
    refreshPeriod = "168h"

# Theme-author tmux statusbars; kept separate from TPM's shared "tmux" directory.
[".config/tmux/plugins/catppuccin/tmux"]
    type = "git-repo"
    url = "https://github.com/catppuccin/tmux.git"
    clone.args = ["--branch", "v2.3.2"]
[".config/tmux/plugins/rose-pine/tmux"]
    type = "git-repo"
    url = "https://github.com/rose-pine/tmux.git"
[".config/tmux/plugins/dracula/tmux"]
    type = "git-repo"
    url = "https://github.com/dracula/tmux.git"
[".config/tmux/plugins/nordtheme/tmux"]
    type = "git-repo"
    url = "https://github.com/nordtheme/tmux.git"
[".config/tmux/plugins/egel/tmux-gruvbox"]
    type = "git-repo"
    url = "https://github.com/egel/tmux-gruvbox.git"
[".config/tmux/plugins/TanglingTreats/tmux-everforest"]
    type = "git-repo"
    url = "https://github.com/TanglingTreats/tmux-everforest.git"

# Official standalone binary avoids the Crystal/LLVM build dependency on macOS.
{{ if and (eq .chezmoi.os "darwin") (eq .chezmoi.arch "arm64") }}
[".local/bin/tmux-fingers"]
    type = "file"
    url = "https://github.com/Morantron/tmux-fingers/releases/download/2.7.1/tmux-fingers-2.7.1-macos-arm64"
    executable = true
    checksum.sha256 = "32b94499f3569d548a6dffd0d89d88e1d6a600c7a8aa891d2b0ee6cc068a720c"
{{ end }}
