[[keymaps.vim-tmux]]
keys = "h"
action = "data_catalog.previous_tab"

[[keymaps.vim-tmux]]
keys = "j"
action = "data_catalog.cursor_down"

[[keymaps.vim-tmux]]
keys = "k"
action = "data_catalog.cursor_up"

[[keymaps.vim-tmux]]
keys = "l"
action = "data_catalog.next_tab"

[[keymaps.vim-tmux]]
keys = "h"
action = "results_viewer.cursor_left"

[[keymaps.vim-tmux]]
keys = "j"
action = "results_viewer.cursor_down"

[[keymaps.vim-tmux]]
keys = "k"
action = "results_viewer.cursor_up"

[[keymaps.vim-tmux]]
keys = "l"
action = "results_viewer.cursor_right"

[[keymaps.vim-tmux]]
keys = "ctrl+d"
action = "results_viewer.cursor_page_down"

[[keymaps.vim-tmux]]
keys = "ctrl+u"
action = "results_viewer.cursor_page_up"
